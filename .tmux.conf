# Terminal key handling (fixes fn+arrows, ctrl+e, etc. on macOS)
set -g default-terminal "tmux-256color"
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# Enable 24-bit truecolor passthrough (fixes invisible text in nvim 0.12+)
set -as terminal-features '*:RGB'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Set refresh interval (in seconds)
set -g status-interval 5

# Right status bar content
set -g status-left ""
set -g status-right ""
set-option -g automatic-rename on
set-option -g allow-rename on

set -g activity-action other
set -g assume-paste-time 1
set -g base-index 1
set -g bell-action none
set -g default-size 80x24
set -g destroy-unattached off
set -g detach-on-destroy on
set -g history-limit 2000
set -g key-table root
set -g lock-after-time 0
set -g lock-command "lock -np"
set -g mouse on
set -g prefix M-b
unbind C-b

set -g repeat-time 500
set -g set-titles on
set -g set-titles-string "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command} - #{b:pane_current_path}}"
set -g silence-action other
set -g status on
set -g update-environment[0] DISPLAY
set -g update-environment[1] KRB5CCNAME
set -g update-environment[2] SSH_ASKPASS
set -g update-environment[3] SSH_AUTH_SOCK
set -g update-environment[4] SSH_AGENT_PID
set -g update-environment[5] SSH_CONNECTION
set -g update-environment[6] WINDOWID
set -g update-environment[7] XAUTHORITY
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g word-separators " "

# Set easier window split keys
bind-key v split-window -h
bind-key h split-window -v

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key M-b send-keys M-b

# Floating terminal popup
bind-key -n M-j display-popup -d "#{pane_current_path}" -w 80% -h 80%

# Edit mode - open scrollback in nvim
bind-key e run-shell 'tmux capture-pane -p -S - > /tmp/tmux-scrollback && tmux new-window "nvim /tmp/tmux-scrollback"'

# Window styling
set -g status-position bottom

# Status bar (catppuccin mocha)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Pane border titles (show process + folder, hide when only one pane)
set -g pane-border-status off
set -g pane-border-format " #{b:pane_current_path} "
set-hook -g window-layout-changed "if -F '#{==:#{window_panes},1}' 'set pane-border-status off' 'set pane-border-status top'"

# Pane borders
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#b4befe"

# Command/message prompt
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#313244,fg=#cdd6f4"

# Window status
set -g window-status-current-style "bg=#313244,fg=#cba6f7"
set -g window-status-style "bg=#1e1e2e,fg=#a6adc8"
set -g window-status-format "#I:#{b:pane_current_path}:#W"
set -g window-status-current-format "#I:#{b:pane_current_path}:#W"

# Optional: clock mode (when using display-time)
set -g clock-mode-colour "#f9e2af"
set -g clock-mode-style 24


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
